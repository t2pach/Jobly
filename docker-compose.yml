services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: jobly, POSTGRES_PASSWORD: jobly, POSTGRES_DB: jobly}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobly"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://jobly:jobly@db:5432/jobly
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
